name: IA que Trabalha - comparacao vozes PT-BR

on:
  push:
    branches:
      - ia-que-trabalha-voice-piper-v10-20260928
    paths:
      - .github/workflows/ia-que-trabalha-voice-piper.yml

permissions:
  contents: read

jobs:
  synthesize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        voice:
          - cadu
          - jeff
    steps:
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Piper
        run: |
          python -m pip install --disable-pip-version-check piper-tts==1.8.0

      - name: Download PT-BR voice
        run: |
          mkdir -p voice-model
          python -m piper.download_voices --data-dir voice-model pt_BR-${{ matrix.voice }}-medium

      - name: Build narration
        run: |
          cat > narration.txt <<'EOF'
          Essa planilha tem três erros. Você consegue encontrar os três em dez segundos?
          Em vez de conferir linha por linha, selecione os dados e peça para a inteligência artificial procurar duplicados, datas inválidas e valores fora do padrão.
          Aqui ela encontrou três suspeitas: uma linha duplicada, uma data impossível e um valor muito acima dos demais.
          A inteligência artificial não decide por você. Ela reduz a busca. Você confere só o que realmente merece atenção.
          EOF
          python -m piper -m pt_BR-${{ matrix.voice }}-medium --data-dir voice-model -f narration_${{ matrix.voice }}.wav --input-file narration.txt --sentence-silence 0.28

      - name: Validate audio
        run: |
          VOICE="${{ matrix.voice }}" python - <<'PY'
          import json, os, wave
          from pathlib import Path
          voice = os.environ["VOICE"]
          p = Path(f"narration_{voice}.wav")
          if not p.exists() or p.stat().st_size < 100000:
              raise SystemExit(f"{p.name} ausente ou pequeno demais")
          with wave.open(str(p), "rb") as w:
              duration = w.getnframes() / w.getframerate()
              meta = {
                  "voice": voice,
                  "model": f"pt_BR-{voice}-medium",
                  "duration_s": round(duration, 2),
                  "sample_rate": w.getframerate(),
                  "channels": w.getnchannels(),
                  "sample_width_bytes": w.getsampwidth(),
                  "size_bytes": p.stat().st_size,
              }
          if not (20 <= duration <= 45):
              raise SystemExit(f"duração inesperada: {duration:.2f}s")
          Path(f"narration_{voice}_meta.json").write_text(json.dumps(meta, indent=2), encoding="utf-8")
          print(json.dumps(meta))
          PY

      - name: Upload narration
        uses: actions/upload-artifact@v4
        with:
          name: ia-que-trabalha-voz-${{ matrix.voice }}-ptbr
          path: |
            narration_${{ matrix.voice }}.wav
            narration.txt
            narration_${{ matrix.voice }}_meta.json
          if-no-files-found: error
          retention-days: 3
